<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>XO LAB</title>
  <meta name="description" content="XO LAB — audio-reactive live visuals for DJs. Runs locally in your browser, on iPhone, Windows and Mac." />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="XO LAB" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/xo-emblem-32.png" />
  <link rel="apple-touch-icon" href="assets/icons/xo-emblem-180.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="brand-emblem splash-emblem"><img src="assets/brand/Futuristic XO emblem on black.png" alt="XO" /></div>
      <div class="brand-wordmark splash-wordmark"><img src="assets/brand/Futuristic XO LAB Wordmark.png" alt="XO LAB" /></div>
      <div class="splash-kicker">VISUAL ENGINE &nbsp;/&nbsp; FX &nbsp;/&nbsp; VJ</div>
      <div class="splash-globe" aria-hidden="true">
        <svg viewBox="0 0 200 90" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="100" cy="45" rx="78" ry="34"/><ellipse cx="100" cy="45" rx="52" ry="34"/><ellipse cx="100" cy="45" rx="24" ry="34"/><path d="M22 45h156M31 28h138M31 62h138M100 3v84M8 45h18M174 45h18"/></svg>
      </div>
      <button class="pill pill-white" id="enter" type="button">ENTER <span aria-hidden="true">[→]</span></button>
      <div class="splash-foot">LOCAL SESSION · YOUR FILES STAY ON THIS DEVICE</div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand-wordmark top-wordmark"><img src="assets/brand/Futuristic XO LAB Wordmark.png" alt="XO LAB" /></div>
      <div class="top-title">VISUAL ENGINE <span>///</span></div>
      <div class="top-status" id="topStatus">LOCAL SESSION</div>
    </header>

    <main class="workspace">
      <section class="stage-col">
        <div class="stage" id="stage">
          <canvas id="view" width="1920" height="1080" aria-label="Live preview"></canvas>
          <div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="focus-mark" id="focusMark" hidden></div>
          <div class="empty" id="empty">
            <b>Drop in a visual to begin</b>
            <small>Video, image or 3D model · Add a track to drive the effects</small>
            <div class="empty-actions">
              <label class="pill pill-white">＋ VISUAL<input type="file" accept="image/*,video/*" data-route="visual" /></label>
              <label class="pill">＋ AUDIO<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac" data-route="audio" /></label>
            </div>
          </div>
          <div class="stage-tags tl">
            <div class="tag" id="recTag" hidden><i class="rec-dot"></i>RENDERING <span id="recTime">0%</span></div>
            <div class="tag" id="modeTag">LIVE PREVIEW</div>
            <div class="tag" id="audioTag">AUDIO OFF</div>
          </div>
          <div class="stage-tags tr"><div class="tag" id="resTag">1920×1080</div></div>
          <div class="stage-loading" id="loading" hidden><span></span><b id="loadingText">LOADING</b></div>
        </div>

        <div class="transport">
          <button class="play" id="play" type="button" aria-label="Play / pause">▶</button>
          <div class="transport-info">
            <div class="filename" id="visualName">No visual loaded</div>
            <div class="sub"><span id="timecode">00:00.00</span> <span class="sep">/</span> <span id="duration">--:--</span></div>
          </div>
          <input class="timeline range" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Scrub" disabled />
          <div class="leds" aria-label="Band hits"><i id="ledBass" title="Bass"></i><i id="ledMid" title="Mid"></i><i id="ledHigh" title="High"></i></div>
        </div>
      </section>

      <div class="side">
        <nav class="tabbar" id="tabbar" aria-label="Panels"></nav>
        <aside class="panels" id="panels"></aside>
      </div>
    </main>
  </div>

  <div class="dialog-back" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <b id="dialogTitle"></b>
      <p id="dialogBody"></p>
      <input id="dialogInput" hidden maxlength="40" />
      <div class="actions"><button class="btn" id="dialogCancel" type="button">CANCEL</button><button class="btn primary" id="dialogOk" type="button">OK</button></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" loop playsinline preload="auto"></audio>
  <input type="file" id="sceneImport" accept=".json,application/json" hidden />

  <script src="js/words.js"></script>
  <script src="js/look3d.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/model3d.js"></script>
  <script src="js/blobs.js"></script>
  <script src="js/strobe.js"></script>
  <script src="vendor/mediabunny/mediabunny-subset.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/history.js"></script>
  <script src="js/project.js"></script>
  <script src="js/live.js"></script>
  <script src="js/midi-engine.js"></script>
  <script src="js/midi-profiles.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/app.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
